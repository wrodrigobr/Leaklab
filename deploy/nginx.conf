# nginx da API (api.grindlabpoker.com) — montado no container como conf.d/default.conf.
#
# POR QUE O `resolver` E A VARIÁVEL EXISTEM AQUI (não mexa sem ler):
#
# Com `proxy_pass http://web:5000;` literal, o nginx resolve o nome `web` UMA VEZ, na carga da
# config. Todo `docker compose up -d --build` recria o container `web` com IP novo, e o nginx
# continua batendo no IP morto — devolve 502 sem nunca chegar na aplicação. E 502 não carrega
# cabeçalho CORS, então o navegador reporta:
#
#     "No 'Access-Control-Allow-Origin' header is present on the requested resource"
#
# que parece problema de CORS e não é: é a API inalcançável. Isso derrubou o login duas vezes no
# mesmo dia (2026-07-27), e as duas foram resolvidas com `docker compose restart nginx` — remendo
# que depende de alguém lembrar.
#
# A correção tem três partes, e todas são necessárias:
#   1. `resolver 127.0.0.11` — o DNS embutido do Docker. Sem declarar, o nginx nem tenta resolver
#      em tempo de execução.
#   2. `proxy_pass $variavel` — com literal ele resolve no boot; só com variável resolve por
#      requisição, respeitando o `valid=10s`.
#   3. `$request_uri` explícito — ao usar variável no proxy_pass, o nginx DESCARTA a URI. Sem
#      isso toda rota cai na raiz, quebra pior que a original e mais difícil de diagnosticar.

server {
  listen 80;
  server_name api.grindlabpoker.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name api.grindlabpoker.com;

  ssl_certificate     /etc/ssl/cloudflare/origin.pem;
  ssl_certificate_key /etc/ssl/cloudflare/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  include /etc/nginx/conf.d/cloudflare-ips.conf;
  real_ip_header CF-Connecting-IP;
  client_max_body_size 6m;

  # DNS interno do Docker. `valid=10s` = o container recriado é encontrado em até 10 segundos,
  # sem restart do nginx. `ipv6=off` porque a rede do compose é IPv4 e a consulta AAAA só
  # adicionaria latência a cada expiração do cache.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location / {
    set $backend http://web:5000;
    proxy_pass $backend$request_uri;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
  }
}

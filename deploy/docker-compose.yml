services:
  web:
    build: { context: ./backend }
    env_file: .env
    expose: ["5000"]
    restart: unless-stopped

  # Consumidor das DUAS filas GTO (solver postflop + pedidos por mão). Serviço dedicado porque os
  # dois workers só sobem dentro do `if __name__ == '__main__'` do app, e o `web` roda gunicorn,
  # que importa o módulo e nunca executa esse bloco. Ver run_solver_consumer.py.
  #
  # NÃO mover para o `web`: gunicorn sobe vários workers e cada um rodaria a própria cópia do
  # loop, processando o mesmo pedido em paralelo.
  solver-consumer:
    build: { context: ./backend }
    env_file: .env
    environment:
      - GTO_SOLVER_CONCURRENCY=2
    command: python run_solver_consumer.py
    # O healthcheck herdado da imagem bate em localhost:5000/health, e este serviço não sobe HTTP
    # nenhum — ficaria eternamente `unhealthy`. Container permanentemente vermelho ensina a
    # ignorar vermelho, e no dia em que ele cair de verdade o sinal estaria igual.
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/cloudflare-ips.conf:/etc/nginx/conf.d/cloudflare-ips.conf:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    # `depends_on` só ordena a subida; não protege contra o `web` ser recriado depois. Quem
    # resolve isso é o `resolver` do nginx.conf.
    depends_on: [web]
    restart: unless-stopped
